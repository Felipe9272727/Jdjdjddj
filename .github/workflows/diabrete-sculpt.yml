name: Diabrete source integration
on:
  push:
    branches: [diabrete/floor3-head]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jubileu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jubileu/package-lock.json
      - run: npm ci
      - run: npm run lint:types
      - run: npx vitest run src/__tests__/diabreteRig.test.ts src/__tests__/f3Acting.test.ts src/__tests__/diabreteNeck.test.ts src/f3Pose.test.ts
