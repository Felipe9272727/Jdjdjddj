name: Finish Floor 10 index upload

on:
  push:
    branches:
      - agent/floor10-language-motor

permissions:
  contents: write

jobs:
  finish-index:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/floor10-language-motor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify index
        shell: bash
        run: |
          cat .github/floor10-index.part-*.b64 | base64 --decode > index.html
          test "$(wc -c < index.html)" -eq 83833099
          echo "ccac24156279ded4c681c4cfb581215aca5b23eb170809c828c471263b30b212  index.html" | sha256sum --check -
      - name: Publish final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/floor10-finish-index.yml .github/floor10-index.part-*.b64
          git add index.html
          git diff --cached --check
          git commit -m "Atualiza build do Floor 10 [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
