name: Finalize Floor 8 overhaul

on:
  push:
    branches:
      - agent/floor8-overhaul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floor8-overhaul-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/floor8-overhaul
          fetch-depth: 1

      - name: Apply verified Floor 8 patches
        run: |
          for patch in .github/floor8-patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git rm -r .github/floor8-patches

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jubileu/package-lock.json

      - name: Install locked dependencies
        working-directory: jubileu
        run: npm ci

      - name: Validate source
        working-directory: jubileu
        run: npm run check

      - name: Build production bundle
        working-directory: jubileu
        run: |
          npm run build
          node inline-build.mjs

      - name: Verify and publish final single-file
        run: |
          test -s index.html
          grep -q "EU AINDA EXISTO" index.html
          grep -q "Costure a memória" index.html
          git rm .github/workflows/floor8-finalize.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Floor 8 memory sequence"
          git push origin HEAD:agent/floor8-overhaul
