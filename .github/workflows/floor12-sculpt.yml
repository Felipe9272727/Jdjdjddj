name: Floor 12 Blender sculpture
on:
  push:
    branches: [flight/floor12-workshop]
    paths: [jubileu/tools/blender/build_concierge.py, .github/workflows/floor12-sculpt.yml]
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Sculpt and export mobile mesh
        run: blender --background --factory-startup --python jubileu/tools/blender/build_concierge.py
      - name: Save generated source on workshop only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jubileu/src/f12ConciergeMesh.ts
          git diff --cached --quiet || git commit -m 'Floor 12: export Blender concierge sculpture'
          git push origin HEAD:flight/floor12-workshop
