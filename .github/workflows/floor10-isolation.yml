name: Floor 10 isolated workbench
on:
  push:
    branches: [nilo/floor10-workshop]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jubileu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jubileu/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.floor10.json
      - run: npx vitest run src/__tests__/f10Cooperacao.test.ts src/__tests__/floor10WillCooperacao.test.ts
      - run: npx vite build --config vite.floor10.config.ts && node inline-build.floor10.mjs
      - name: Start isolated entry
        run: |
          npx vite --config vite.floor10.config.ts --host 127.0.0.1 --port 5173 > /tmp/floor10-isolated-vite.log 2>&1 &
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../floor10-preview > /tmp/floor10-preview-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/floor10.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: node tools/floor10-smoke.mjs
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor10-isolated-verification
          path: floor10-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: floor10-isolated-preview
          path: floor10-preview/
      - name: Save preview only to the isolated branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          cd ..
          ISOLATED_BRANCH=nilo/floor10-workshop
          git fetch origin "$ISOLATED_BRANCH"
          CURRENT_HEAD=$(git rev-parse "origin/$ISOLATED_BRANCH")
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/floor10-isolation.yml
          git add -f floor10-preview/
          git add -u .github/workflows/floor10-isolation.yml
          git commit -m 'build(floor10): save isolated preview and remove temporary validator'
          git push origin "HEAD:refs/heads/$ISOLATED_BRANCH"
          OLD_TEMP_HEAD=$(git ls-remote --heads origin refs/heads/agent/floor10-validation | cut -f1)
          if test "$OLD_TEMP_HEAD" = 0423bf13ed22ff3f8b13a147d47c0e84de9d5d24; then
            git push origin --delete agent/floor10-validation
          fi
