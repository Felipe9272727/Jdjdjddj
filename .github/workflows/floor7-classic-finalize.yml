name: Finalize classic Floor 7 ship

on:
  push:
    branches:
      - agent/floor7-rebuild-v2

permissions:
  contents: write

concurrency:
  group: floor7-rebuild-v2-classic-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-classic-ship]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jubileu/package-lock.json
      - name: Validate and build single-file game
        working-directory: jubileu
        run: |
          npm ci
          npm run check
          npm run build
          node inline-build.mjs
      - name: Commit build and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/floor7-classic-finalize.yml
          git commit -m "build: finaliza navio classico do Andar 7"
          git push origin HEAD:agent/floor7-rebuild-v2
