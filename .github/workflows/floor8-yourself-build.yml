name: Floor 8 Yourself single-file build

on:
  push:
    branches:
      - agent/floor8-yourself-overhaul
    paths:
      - .github/workflows/floor8-yourself-build.yml

permissions:
  contents: write

concurrency:
  group: floor8-yourself-build
  cancel-in-progress: true

jobs:
  build-and-remove:
    if: github.ref == 'refs/heads/agent/floor8-yourself-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: agent/floor8-yourself-overhaul
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jubileu/package-lock.json

      - name: Install exact dependencies
        working-directory: jubileu
        run: npm ci

      - name: Run complete test suite
        working-directory: jubileu
        run: npm test

      - name: Build production bundle
        working-directory: jubileu
        run: npm run build

      - name: Generate root single-file
        working-directory: jubileu
        run: node inline-build.mjs

      - name: Validate, commit, and remove this workflow
        shell: bash
        run: |
          test -s index.html
          test "$(wc -c < index.html)" -gt 50000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/floor8-yourself-build.yml
          git commit -m "Build Floor 8 Yourself single-file"
          git push origin HEAD:agent/floor8-yourself-overhaul
