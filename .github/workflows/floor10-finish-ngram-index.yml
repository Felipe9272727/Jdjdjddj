name: Finish Floor 10 N-gram index

on:
  push:
    branches:
      - claude/persistent-download-storage-i6l88v

permissions:
  contents: write

concurrency:
  group: floor10-ngram-index
  cancel-in-progress: false

jobs:
  finish-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify index
        shell: bash
        run: |
          set -euo pipefail
          cat .github/floor10-ngram-index.part-*.b64 | base64 --decode > /tmp/floor10-index.html
          test "$(wc -c < /tmp/floor10-index.html)" -eq 92037022
          echo "e389e644d69e98484b1b67ba0dd027313e67ee93cf3c6c97ba524193da49348f  /tmp/floor10-index.html" | sha256sum -c -
          test "$(git hash-object /tmp/floor10-index.html)" = "64e62b4d95f1fc46de505e922e4d62eca83390de"
          mv /tmp/floor10-index.html index.html
      - name: Commit the verified build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/floor10-ngram-index.part-*.b64
          git rm .github/workflows/floor10-finish-ngram-index.yml
          git add index.html
          git diff --cached --check
          git commit -m "Atualiza build N-gram do Floor 10 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
