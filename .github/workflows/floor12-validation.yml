name: Floor 12 validation (temporary)

on:
  workflow_dispatch:
  push:
    branches: [flight/floor12-workshop]
    paths:
      - "jubileu/src/Floor12*.tsx"
      - "jubileu/src/f12*.ts"
      - "jubileu/src/floor12*.tsx"
      - "jubileu/src/__tests__/f12*.test.ts"
      - "jubileu/floor12-dev.html"
      - "jubileu/bancada-navegador/floor12-screenshots.mjs"
      - ".github/workflows/floor12-validation.yml"

permissions:
  contents: read

jobs:
  floor12:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jubileu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jubileu/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint:types
      - name: Floor 12 logic tests
        run: npx vitest run src/__tests__/f12Boss.test.ts src/__tests__/f12Simulacao.test.ts src/__tests__/f12FlightWeapon.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Floor 12 dev harness
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/floor12-vite.log 2>&1 &
          echo $! > /tmp/floor12-vite.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/index.html?f12 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/floor12-vite.log
          exit 1
      - name: Capture browser validation screenshots
        run: node bancada-navegador/floor12-screenshots.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floor12-browser-validation
          path: jubileu/artifacts/floor12-browser
          if-no-files-found: error
