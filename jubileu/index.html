    <script>
      // ── TROCAR A VERSÃO DO wllama PELA URL ────────────────────────────
      //
      // `?wllama=3.6.0` aponta os quatro cérebros para outra versão do runtime
      // sem tocar no padrão. Existe porque a pergunta "vale atualizar?" só se
      // responde no aparelho de quem joga, e trocar a versão no código para
      // descobrir isso arrisca o único celular onde o jogo é testado.
      //
      // TEM DE SER AQUI, e não no main.tsx: os módulos leem `__wllamaCdn` na
      // hora em que são importados (`const CDN = globalThis.__wllamaCdn ?? …`),
      // e o main.tsx importa o App na primeira linha. Qualquer atribuição lá
      // dentro chegaria tarde.
      //
      // O que muda entre versões é o llama.cpp embutido — 3.5.1 traz a b9640,
      // 3.6.0 traz a b10454 —, e é lá embaixo que moram o backend WebGPU e as
      // otimizações de leitura de prompt que este jogo espera.
      try {
        var __v = new URLSearchParams(location.search).get('wllama');
        if (__v && /^[0-9]+\.[0-9]+\.[0-9]+$/.test(__v)) {
          window.__wllamaCdn = 'https://cdn.jsdelivr.net/npm/@wllama/wllama@' + __v + '/esm';
          console.info('[floor10] wllama trocado para ' + __v + ' por ?wllama=');
        }
      } catch (e) { /* sem URL não há troca, e o padrão segue */ }

      // ── `?onnx=4.2.0` — TROCAR O transformers.js PELA URL ─────────────
      //
      // Mesma ideia da chave acima, para o outro runtime: o juiz de tom e o
      // reflexo rodam em ONNX, e a versão em uso é a 3.8.1 (dez/2025). A atual
      // é a 4.2.0 (abr/2026), com um salto de major no meio.
      //
      // MEDIDO na bancada, com biblioteca e modelo servidos localmente:
      //
      //     3.8.1 em CPU ..... 243 ms por frase
      //     4.2.0 em CPU ..... 579 ms por frase   (2,4x MAIS LENTA)
      //     vetores .......... IDÊNTICOS nas 8 primeiras dimensões
      //
      // O "idênticos" é a parte que importa para a segurança: o juiz decide por
      // cosseno contra âncoras com margem ZERO, um número varrido e calibrado
      // nos vetores da 3.8.1. Vetor diferente seria o juiz marcando frases
      // diferentes sem ninguém perceber. Ele não muda.
      //
      // A lentidão em CPU é real e desaconselha a troca — a única razão para
      // subir é o backend WebGPU, que melhorou muito nessa faixa e que esta
      // caixa não sabe medir (aqui não há adaptador de GPU de verdade). Por
      // isso a chave: a resposta está no celular, não aqui.
      try {
        var __o = new URLSearchParams(location.search).get('onnx');
        if (__o && /^[0-9]+\.[0-9]+\.[0-9]+$/.test(__o)) {
          window.__onnxCdn = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@' + __o;
          window.__onnxModuleUrl = window.__onnxCdn + '/dist/transformers.min.js';
          console.info('[floor10] transformers.js trocado para ' + __o + ' por ?onnx=');
        }
      } catch (e) { /* sem URL não há troca, e o padrão segue */ }
    </script>
