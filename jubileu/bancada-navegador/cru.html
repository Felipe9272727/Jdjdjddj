<!doctype html><meta charset=utf8><body><script type=module>
const { Wllama } = await import('/wllama-cdn/index.js');
// Esta versão do wllama quer `{ default }`, como o jogo usa. A forma antiga
// ('single-thread/...') estoura "default is missing from pathConfig" — e sem o
// ouvinte de `pageerror` isso morria mudo por 15 minutos.
const w = new Wllama({ default:'/wllama-cdn/wasm/wllama.wasm' }, { suppressNativeLog:true });
await w.loadModelFromUrl('/modelo.gguf', { n_ctx: 2048, n_threads: 8 });
const r = await w.createChatCompletion({
  messages:[{role:'system',content:'You are Nilo. Decide one action.'},
            {role:'user',content:'Options: idle, observe-player, approach-player, make-space, inspect-elevator, talk-player.\nThe player is close and looking at you.\nThink briefly, then end with a line exactly like: CHOICE: <option>'}],
  stream:false, max_tokens:320, temperature:0.7, top_p:0.95, top_k:40,
  penalty_repeat:1.15, penalty_last_n:256, cache_prompt:true,
  chat_template_kwargs:{ enable_thinking:true },
});
const t = typeof r==='string'? r : (r?.choices?.[0]?.message?.content ?? JSON.stringify(r).slice(0,400));
console.log('ABRIU <think>?', t.includes('<think>'));
console.log('FECHOU </think>?', t.includes('</think>'));
console.log('TEM CHOICE?', /CHOICE\s*:/i.test(t));
console.log('TAMANHO:', t.length);
console.log('TEXTO:', JSON.stringify(t.slice(0,900)));
globalThis.__pronto = true;
</script></body>
