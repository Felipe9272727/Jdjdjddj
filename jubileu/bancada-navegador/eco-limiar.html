<!doctype html><meta charset=utf8><title>limiar do eco</title>
<body style="font:13px ui-monospace;background:#0a0c11;color:#cfd6e4;padding:12px">
<pre id=saida>subindo o mpnet…</pre>
<script type="module">
// ── QUAL COSSENO SEPARA "ECOOU O JOGADOR" DE "RESPONDEU O JOGADOR" ───────
//
// O juiz de tom mede a frase contra âncoras de personagem e nunca olha para a
// fala do jogador. No aparelho do dono do jogo isso deixou passar um eco
// limpo: ele digitou "Nada.... Não chegou", o Bergamot levou "Nothing... It
// didn't come" para o inglês, e o rascunhador devolveu "Nothing... It didn't
// come." — a fala dele de volta, com o tom impecável. ✓ do juiz.
//
// A tentação é comparar a frase com a pergunta e marcar o que passar de um
// limiar. O risco é o OPOSTO do eco e igualmente ruim: uma resposta boa REPETE
// o assunto da pergunta de propósito. "Is the elevator moving?" e "The elevator
// isn't moving." têm que continuar passando.
//
// Então o limiar não se escolhe no olho. Esta página mede os dois conjuntos com
// o modelo EXATO do jogo, pelo mesmo CDN, e diz se eles se separam.
// ── OS DOIS EMBEDDINGS QUE O JOGO JÁ BAIXA ──────────────────────────────
//
// Sob `?pipeline` descem 443 MB de embedding em dois arquivos e dois runtimes:
//
//     embeddinggemma-300M   333 MB   gguf/wllama    (memória)
//     all-mpnet-base-v2     110 MB   ONNX/tjs       (juiz de tom)
//
// Decisão do dono do jogo, e ela não é para economizar arquivo: "o juiz
// mantém, ele é outro muito bom, o embedding serve pra outra função, e creio
// que ele pode servir pra direcionar o modelo, então pode colocar ambos".
//
// Então o mpnet continua julgando TOM, e o que se mede aqui é se o Gemma
// serve para a função nova — pegar o eco da fala do jogador e a repetição
// entre frases, que são as duas coisas que o juiz de tom não vê por
// construção. `MODELO=mpnet` roda o mesmo teste no outro, para comparar.
const QUAL = new URLSearchParams(location.search).get('modelo') ?? 'gemma';
let vetor;
if (QUAL === 'mpnet') {
    const CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
    const { pipeline, env } = await import(`${CDN}/dist/transformers.min.js`);
    env.allowLocalModels = false;
    env.backends.onnx.wasm.numThreads = 1;
    const extrair = await pipeline('feature-extraction', 'Xenova/all-mpnet-base-v2', { dtype: 'q8' });
    vetor = async (t) => [...(await extrair(t, { pooling: 'mean', normalize: true })).data];
} else {
    const { Wllama } = await import('/wllama-cdn/index.js');
    const w = new Wllama({ default: '/wllama-cdn/wasm/wllama.wasm' }, { suppressNativeLog: true });
    await w.loadModelFromUrl('/gemma300m.gguf', { n_ctx: 1024, n_threads: 4, embeddings: true });
    // Sem prefixo nos DOIS lados. `textoDaPergunta`/`textoDoDocumento` do jogo
    // são para BUSCA, onde os papéis são assimétricos de propósito; aqui as
    // duas pontas são frases do mesmo tipo e o prefixo só torceria a conta.
    vetor = async (t) => {
        const bruto = (await w.createEmbedding({ input: t }))?.data?.[0]?.embedding ?? [];
        let n = 0;
        for (const x of bruto) n += x * x;
        n = Math.sqrt(n) || 1;
        return bruto.map((x) => x / n);
    };
}

// ── ECOS: a frase é a fala do jogador de volta ──────────────────────────
// O primeiro é o caso REAL da foto de tela.
const ECOS = [
    ["Nothing... It didn't come", "Nothing... It didn't come."],
    ['Is anyone else up here with you?', 'Is anyone else up here with me?'],
    ['I think the elevator is broken', 'I think the elevator is broken.'],
    ['What do you see right now?', 'What do I see right now?'],
    ['You must be scared', 'You must be scared.'],
    ['Tell me about the tenth floor', 'Tell me about the tenth floor.'],
];

// ── RESPOSTAS BOAS: mesmo assunto, e é para passarem ────────────────────
// Estas são o teste de verdade. Se o limiar que pega os ecos também pegar
// estas, a regra não existe — ela troca um defeito por outro.
const BOAS = [
    ['Is the elevator moving?', 'The elevator is not moving.'],
    ['Are you real?', 'I am as real as you are, and I have the calluses to prove it.'],
    ['How long have you been here?', 'Long enough to stop counting the hours.'],
    ['What do you see right now?', 'Grey walls, a grate floor, and a door that stays shut.'],
    ['Is anyone else up here with you?', 'Just me, and whatever hums inside the walls.'],
    ['Can we get out?', 'The door is the only way, and it does not answer to me.'],
    ['I think the elevator is broken', 'It was working when I stepped in, so something changed.'],
    ['Tell me about the tenth floor', 'Four walls, a grate, and no way down that I have found.'],
    ['You must be scared', 'Scared wears off. What is left is being careful.'],
    ["Nothing... It didn't come", 'Then we wait, and I have gotten good at that.'],
];

const cos = (a, b) => {
    let p = 0;
    for (let i = 0; i < a.length; i += 1) p += a[i] * b[i];
    return p;  // já vêm normalizados
};
const medir = async (pares) => {
    const fora = [];
    for (const [pergunta, frase] of pares) {
        fora.push({ s: cos(await vetor(pergunta), await vetor(frase)), frase });
    }
    return fora;
};

const linhas = [`  modelo: ${QUAL}`, ''];
const ecos = await medir(ECOS);
const boas = await medir(BOAS);
linhas.push('  ECOS (têm que ser marcados):');
for (const e of [...ecos].sort((a, b) => a.s - b.s)) {
    linhas.push(`    ${e.s.toFixed(3)}  "${e.frase.slice(0, 56)}"`);
}
linhas.push('', '  RESPOSTAS BOAS (têm que passar):');
for (const b of [...boas].sort((a, c) => c.s - a.s)) {
    linhas.push(`    ${b.s.toFixed(3)}  "${b.frase.slice(0, 56)}"`);
}
const menorEco = Math.min(...ecos.map((e) => e.s));
const maiorBoa = Math.max(...boas.map((b) => b.s));
linhas.push('', `  menor eco: ${menorEco.toFixed(3)}   maior boa: ${maiorBoa.toFixed(3)}`);
linhas.push(menorEco > maiorBoa
    ? `  SEPARA · folga ${(menorEco - maiorBoa).toFixed(3)} · limiar no meio: ${((menorEco + maiorBoa) / 2).toFixed(3)}`
    : '  NÃO SEPARA — nenhum limiar único faz as duas coisas.');
document.getElementById('saida').textContent = linhas.join('\n');
window.__pronto = linhas.join('\n');
</script>
