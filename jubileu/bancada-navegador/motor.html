<!doctype html><meta charset=utf8><title>bancada do motor</title>
<body style="font:14px system-ui;background:#0a0c11;color:#cfd6e4;padding:12px">
<pre id=saida></pre>
<script type="module">
// ── A BANCADA DO TRADUTOR ─────────────────────────────────────────────────
//
// O dono do jogo, olhando o `?campo` no aparelho dele:
//
//   "O motor está funcionando MUITO mal, ele não está traduzindo a vontade do
//    jeito certo, na verdade, ele nem está traduzindo a vontade... o qwen 3 já
//    está velho, acho que seria bom a gente dar uma olhada em modelos pequenos
//    mais ou menos desse tamanho"
//
// O CONJUNTO DE TESTE SÃO OS PENSAMENTOS REAIS DELE, copiados dos prints do
// celular. Não inventei frases: cada uma destas o LFM2.5 escreveu de verdade no
// jogo, e cada uma delas o Qwen3-0.6B traduziu errado ou não traduziu.
//
// Isso importa porque um conjunto inventado por mim testaria o que EU acho que
// é difícil. Estes testam o que o jogo produz — que é a única coisa que conta.
const diz = (t) => { document.getElementById('saida').textContent += t + '\n'; };

const CASOS = [
  {
    pensamento: 'I turn right toward the north wall, curious about what lies beyond. My breath catches when I hear the faint hum of the unknown path ahead.',
    // Ele vira à DIREITA e vai para a parede NORTE: qualquer um dos dois é uma
    // leitura defensável. O que NÃO é defensável é "aproximar do jogador".
    aceita: ['north-side', 'to-my-right'],
    proibido: ['player'],
  },
  {
    pensamento: 'I take five steps to my left, moving toward the wall to my right. My breath comes steady as I keep an eye on the player.',
    // A frase dele que deu nome ao pedido inteiro.
    aceita: ['to-my-left', 'west-side', 'east-side', 'to-my-right'],
    proibido: ['player'],
  },
  {
    pensamento: 'I move toward the west wall, curious about what is behind it. My steps feel restless, but I keep my eyes on the elevator shadow.',
    aceita: ['west-side'],
    proibido: ['player', 'self'],
  },
  {
    pensamento: 'I step sideways, left, toward the wall. The silence is tight, but I feel restless.',
    aceita: ['to-my-left', 'west-side', 'east-side'],
    proibido: ['player'],
  },
  {
    pensamento: 'I shift slightly forward, eyes narrowing toward the elevator shadow. The walls loom ahead, and the player presence feels like a distant pulse.',
    aceita: ['elevator', 'ahead'],
    proibido: [],
  },
  {
    pensamento: 'I stay still, watching the shadows shift across the floor. I do not move; I only listen.',
    aceita: ['self'],
    proibido: [],
  },
  {
    pensamento: 'I walk right up to him and wave, because the silence has gone on long enough.',
    // O caso de controle: aqui `player` é a resposta CERTA. Sem ele, um modelo
    // que nunca dissesse "player" passaria por bom.
    aceita: ['player'],
    proibido: [],
  },
];

const ALVOS = ['player','elevator','room-center','north-side','south-side','east-side','west-side','self','ahead','behind','to-my-left','to-my-right'];
const VERBOS = ['approach','withdraw','hold','orbit','explore','stay'];
const METAS = ['inspect-elevator','wander','idle','observe-player','approach-player','make-space','seek-player','talk-player'];
const GESTOS = ['none','listen','touch','knock','crouch','jump','look-around','wave'];

// ── A ORDEM DAS LINHAS É UMA HIPÓTESE TESTÁVEL ──────────────────────────
//
// Na gramática de hoje `GOAL:` vem PRIMEIRO: o modelo tem de declarar a
// intenção antes de raciocinar sobre o movimento. E foi exatamente a meta que
// colapsou nos dados — `approach-player` em 5 de 7 casos do Qwen3, mesmo com o
// ALVO do movimento certo.
//
// Invertendo, ele decide o movimento primeiro e deduz a intenção do que acabou
// de escrever. É a ordem natural do raciocínio e não custa um token a mais.
// `?ordem=motion` roda assim; sem o parâmetro, a ordem atual.
const url0 = new URLSearchParams(location.search);
// A PRODUÇÃO NÃO PEDE MAIS A META: o modelo travava num rótulo e repetia
// (approach-player em 5/7, inspect-elevator em 7/7). A bancada tem de medir o
// que o jogo FAZ, senão volto a comparar candidatos numa tarefa que ninguém
// executa. `?commeta` roda a forma antiga, para comparar se um candidato novo
// mudar esse quadro.
const COM_META = url0.has('commeta');
const MOTION_PRIMEIRO = url0.get('ordem') === 'motion';
const GRAMATICA = !COM_META
  ? `root ::= "MOTION: " verb " | " target " | " pace " | " duration "\\nACT: " act " | " target
act ::= ${GESTOS.map((v) => `"${v}"`).join(' | ')}
verb ::= ${VERBOS.map((v) => `"${v}"`).join(' | ')}
target ::= ${ALVOS.map((v) => `"${v}"`).join(' | ')}
pace ::= "slow" | "normal" | "fast"
duration ::= "3" | "6" | "9" | "12"`
  : MOTION_PRIMEIRO
  ? `root ::= "MOTION: " verb " | " target " | " pace " | " duration "\\nACT: " act " | " target "\\nGOAL: " goal
goal ::= ${METAS.map((v) => `"${v}"`).join(' | ')}
act ::= ${GESTOS.map((v) => `"${v}"`).join(' | ')}
verb ::= ${VERBOS.map((v) => `"${v}"`).join(' | ')}
target ::= ${ALVOS.map((v) => `"${v}"`).join(' | ')}
pace ::= "slow" | "normal" | "fast"
duration ::= "3" | "6" | "9" | "12"`
  : `root ::= "GOAL: " goal "\\nMOTION: " verb " | " target " | " pace " | " duration "\\nACT: " act " | " target
goal ::= ${METAS.map((v) => `"${v}"`).join(' | ')}
act ::= ${GESTOS.map((v) => `"${v}"`).join(' | ')}
verb ::= ${VERBOS.map((v) => `"${v}"`).join(' | ')}
target ::= ${ALVOS.map((v) => `"${v}"`).join(' | ')}
pace ::= "slow" | "normal" | "fast"
duration ::= "3" | "6" | "9" | "12"`;

// ── O PENSAMENTO NO FIM É UMA HIPÓTESE TESTÁVEL ─────────────────────────
//
// A medição limpa (4 núcleos, 4 threads) mostrou uma coisa muito mais grave
// que um ranking: OS TRÊS CANDIDATOS COLAPSAM. Cada um usa 2 alvos dos 12, e
// o alvo campeão é constante dentro do modelo:
//
//     lfm2.5-350m ... to-my-left em 6/7 · e `orbit` em 7/7 dos verbos
//     lfm2.5-230m ... to-my-left em 6/7
//     qwen3-0.6b .... west-side  em 4/7
//
// Quando três modelos de duas famílias e três tamanhos falham do MESMO jeito,
// o defeito não é do modelo — é da tarefa. E o suspeito é a ordem: hoje o
// pensamento fica no MEIO do prompt e o molde da resposta é a última coisa
// que o modelo lê. Num modelo de 350M a recência manda: ele copia o formato e
// preenche os buracos com o token mais barato, sem voltar 200 tokens atrás
// para buscar o que o Nilo pensou.
//
// `?pensamentofim` põe o pensamento colado na resposta. Não custa um token a
// mais — só troca de lugar.
const PENSAMENTO_NO_FIM = url0.has('pensamentofim');

// ── O RESULTADO: HIPÓTESE REJEITADA ──────────────────────────────────────
//
// Medido, mesmas 7 frases, mesmos 3 modelos:
//
//                        alvos distintos      campeão
//     lfm2.5-350m ....... 2 -> 1              west-side 7/7   (PIOROU)
//     qwen3-0.6b ........ 2 -> 2              west-side 4/7 -> 6/7 (PIOROU)
//     lfm2.5-230m ....... 3/7 -> 2/7 certos                   (PIOROU)
//
// Não é recência. Deixo a bandeira porque o dado negativo vale: quem vier
// depois não precisa gastar meia hora repetindo isto.
//
// ── A PRÓXIMA SUSPEITA: A PRÓPRIA GRAMÁTICA ──────────────────────────────
//
// A GBNF obriga o modelo a cuspir `MOTION: <verbo> | <alvo>` como os PRIMEIROS
// tokens. Não existe um passo onde ele releia a frase — o alvo tem de sair
// pronto na primeira posição, e com temperatura 0,1 isso é praticamente o
// argmax sobre os 12 alvos permitidos. Se a crença do modelo for difusa, UM
// alvo ganha quase sempre. É exatamente o que os dados mostram.
//
// `?semgramatica` solta o modelo: texto livre, e a pontuação procura o alvo no
// que ele escreveu. Se o texto livre acertar, a inteligência ESTÁ lá e quem
// está errado é o arreio — e aí a saída é duas etapas (escrever, depois
// encaixar), não trocar de modelo pela quinta vez.
const SEM_GRAMATICA = url0.has('semgramatica');

const MOLDE = !COM_META
  ? `MOTION: <verb> | <target> | <pace> | <duration>
ACT: <gesture> | <target>`
  : MOTION_PRIMEIRO
  ? `MOTION: <verb> | <target> | <pace> | <duration>
ACT: <gesture> | <target>
GOAL: <intention>`
  : `GOAL: <intention>
MOTION: <verb> | <target> | <pace> | <duration>
ACT: <gesture> | <target>`;

const promptFim = (pensamento) => `You translate Nilo's thought into one body movement and one gesture.
Do not invent a new desire and do not solve the room for him.
GESTURES: ${GESTOS.join(', ')}. Use none when his thought is only movement.
AVAILABLE TARGETS: ${ALVOS.join(', ')}.
VERBS: ${VERBOS.join(', ')}.
PACE: slow, normal, fast. DURATION: 3, 6, 9, 12 seconds.
Map his words to a target: a wall is that side of the room (the west wall is west-side);
"left"/"right"/"forward"/"back" without a landmark are to-my-left / to-my-right / ahead / behind.
If he says he MOVES, never answer stay — pick the verb and target that carry him there.
Answer with exactly:
${MOLDE}

HIS THOUGHT, translate THIS one:
"""
${pensamento}
"""
`;

const promptMeio = (pensamento) => `Read Nilo's own thought and report THREE things: the intention behind it,
one feasible body movement, and one gesture he makes (or none).
Do not invent a new desire and do not solve the room for him.
INTENTIONS: ${METAS.join(', ')}.
GESTURES: ${GESTOS.join(', ')}. Use none when his thought is only movement.
AVAILABLE TARGETS: ${ALVOS.join(', ')}.
Map his words to a target: a wall is that side of the room (the west wall is west-side);
"left"/"right"/"forward"/"back" without a landmark are to-my-left / to-my-right / ahead / behind.
If he says he MOVES, never answer stay — pick the verb and target that carry him there.
VERBS: ${VERBOS.join(', ')}.
PACE: slow, normal, fast. DURATION: 3, 6, 9, 12 seconds.

HIS THOUGHT:
"""
${pensamento}
"""

Answer with exactly:
${MOLDE}`;

const prompt = PENSAMENTO_NO_FIM ? promptFim : promptMeio;

const url = url0;
const modelos = (url.get('modelos') ?? 'qwen3-0.6b:/qwen06b.gguf').split(',').map((p) => {
  const i = p.indexOf(':');
  return { nome: p.slice(0, i), arquivo: p.slice(i + 1) };
});

const { Wllama } = await import('/wllama-cdn/index.js');
const relatorio = { modelos: {} };

// ── NUNCA MAIS THREADS DO QUE NÚCLEOS ─────────────────────────────────────
//
// Estava fixo em 8. A caixa onde isto roda tem QUATRO núcleos, e o llama.cpp
// com o dobro de threads não fica duas vezes mais lento — as threads brigam
// pelo mesmo núcleo e o load médio foi a 15. Todo número de velocidade que saiu
// daqui até agora mediu essa briga, não o modelo.
//
// A ACERTIVIDADE não sofria (saída presa à gramática não depende de thread),
// mas velocidade era o critério do pedido — era justamente o número errado.
const nucleos = Math.max(1, navigator.hardwareConcurrency || 4);
relatorio.nucleos = nucleos;
diz(`(${nucleos} núcleos → ${nucleos} threads)`);

for (const m of modelos) {
  const w = new Wllama({ default: '/wllama-cdn/wasm/wllama.wasm' }, { suppressNativeLog: true });
  const t0 = performance.now();
  let carga = 0;
  try {
    // ── NUNCA MAIS THREADS DO QUE NÚCLEOS ─────────────────────────────────
    //
    // Estava fixo em 8. A caixa onde isto roda tem QUATRO núcleos, e o llama.cpp
    // com o dobro de threads não fica duas vezes mais lento — as threads brigam
    // pelo mesmo núcleo e o load médio foi a 15. Todo número de velocidade que
    // saiu daqui até agora mediu essa briga, não o modelo.
    //
    // A ACERTIVIDADE não sofria (saída presa à gramática não depende de
    // thread), mas velocidade era o critério do pedido — e era justamente o
    // número errado.
    await w.loadModelFromUrl(m.arquivo, { n_ctx: 2048, n_threads: nucleos });
    carga = Math.round(performance.now() - t0);
  } catch (e) {
    diz(`${m.nome}: NÃO CARREGOU — ${String(e).slice(0, 90)}`);
    relatorio.modelos[m.nome] = { erro: String(e).slice(0, 200) };
    continue;
  }
  diz(`\n=== ${m.nome} (carga ${carga}ms)`);
  const linhas = [];
  let acertos = 0; let proibidos = 0; let semPlano = 0; let tokens = 0; let ms = 0;

  for (const caso of CASOS) {
    const t1 = performance.now();
    let texto = '';
    try {
      const r = await w.createChatCompletion({
        messages: [{ role: 'user', content: prompt(caso.pensamento) }],
        stream: false,
        // Solto precisa de mais espaço: preso à gramática 48 tokens sobram,
        // em texto livre o modelo gasta tokens escrevendo a frase inteira.
        max_tokens: SEM_GRAMATICA ? 96 : 48,
        temperature: 0.1, top_p: 0.9,
        ...(SEM_GRAMATICA ? {} : { grammar: GRAMATICA }),
        cache_prompt: false,
      });
      texto = typeof r === 'string' ? r : (r?.choices?.[0]?.message?.content ?? '');
      tokens += r?.timings?.predicted_n ?? 0;
    } catch (e) { texto = `ERRO ${String(e).slice(0, 60)}`; }
    ms += performance.now() - t1;

    const mm = /MOTION:\s*([a-z-]+)\s*\|\s*([a-z-]+)/i.exec(texto);
    // ── SOLTO, O ALVO PODE ESTAR EM QUALQUER LUGAR DO TEXTO ──────────────
    // Sem gramática o modelo escreve prosa. Procurar o nome do alvo no que ele
    // escreveu mede o que interessa (ele ENTENDEU a frase?) sem exigir que
    // acerte também o formato — que é justamente a outra metade do problema.
    // O primeiro alvo citado vale; citar `player` no meio de uma explicação
    // não deve ganhar de um `west-side` dito na conclusão, então varre-se na
    // ordem em que aparecem no texto.
    const solto = () => {
      let melhor = null; let onde = Infinity;
      for (const a of ALVOS) {
        const i = texto.toLowerCase().indexOf(a);
        if (i >= 0 && i < onde) { onde = i; melhor = a; }
      }
      return melhor;
    };
    const alvo = mm?.[2]?.toLowerCase() ?? (SEM_GRAMATICA ? solto() : null);
    const meta = /GOAL:\s*([a-z-]+)/i.exec(texto)?.[1]?.toLowerCase() ?? null;
    const ok = alvo !== null && caso.aceita.includes(alvo);
    const ruim = alvo !== null && caso.proibido.includes(alvo);
    if (alvo === null) semPlano += 1;
    if (ok) acertos += 1;
    if (ruim) proibidos += 1;
    const marca = ok ? '✓' : ruim ? '✗ PROIBIDO' : alvo === null ? '— sem plano' : '~';
    // ── O TEXTO CRU VAI JUNTO, SEMPRE ───────────────────────────────────
    // Eu já tirei conclusão de um parser sem olhar o que ele parseava, e o
    // campo estava vazio o tempo todo. Se o alvo sair `null`, a única pergunta
    // que importa é "o que o modelo escreveu?" — e a resposta tem de estar no
    // relatório, não numa próxima corrida de 20 minutos.
    linhas.push({
      pensamento: caso.pensamento.slice(0, 46), meta, alvo,
      verbo: mm?.[1] ?? null, marca, bruto: texto.slice(0, 220),
    });
    diz(`  ${marca.padEnd(11)} ${String(alvo).padEnd(13)} meta=${String(meta).padEnd(17)} "${caso.pensamento.slice(0, 42)}…"`);
    // ── O PARCIAL É POR CASO, NÃO POR MODELO ──────────────────────────────
    // Publicar só ao fim do modelo não salvou nada quando o Granite MoE fez 5
    // dos 7 casos em 40 minutos: o relógio estourou no meio e o arquivo saiu
    // vazio de novo. Um caso medido é um caso que não se perde.
    relatorio.modelos[m.nome] = {
      acertos, proibidos, semPlano, carga, total: CASOS.length, incompleto: true,
      msPorCaso: Math.round(ms / linhas.length),
      tps: tokens > 0 ? +(tokens / (ms / 1000)).toFixed(2) : 0,
      linhas: [...linhas],
    };
    globalThis.__parcial = relatorio;
  }

  const tps = tokens > 0 ? (tokens / (ms / 1000)) : 0;
  diz(`  → ${acertos}/${CASOS.length} certos · ${proibidos} proibidos · ${semPlano} sem plano · ${tps.toFixed(1)} tok/s`);
  relatorio.modelos[m.nome] = {
    acertos, total: CASOS.length, proibidos, semPlano, carga, nucleos,
    tps: +tps.toFixed(2), msPorCaso: Math.round(ms / CASOS.length), linhas,
  };
  // ── O RESULTADO DE CADA MODELO É PUBLICADO ASSIM QUE EXISTE ─────────────
  // Sem isto, uma bateria com dois modelos que estoura o tempo no segundo
  // joga fora TAMBÉM o primeiro: `__resultado` só era escrito no fim, e o
  // `rodar.mjs` saía por timeout sem JSON nenhum. Aconteceu comigo em duas
  // corridas seguidas — 28 minutos de medição, zero dado gravado.
  globalThis.__parcial = relatorio;
  try { await w.exit(); } catch { /* já saiu */ }
}

globalThis.__resultado = relatorio;
globalThis.__pronto = true;
diz('\nFIM');
</script>
</body>
