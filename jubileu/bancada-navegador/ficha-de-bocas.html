<!doctype html>
<!--
  A FICHA DO FELIPE, DESENHADA PELO PINCEL DO JOGO.

  Ele mandou duas folhas de boca. Conferir se o que eu programei é o que ele
  desenhou, uma boca por vez pela URL `?boca=`, custava seis minutos de bancada
  por rodada e mostrava a boca do tamanho de uma unha, num rosto 3D, de longe.

  Esta página chama `desenharBoca` — a MESMA função que pinta a textura no jogo,
  não uma cópia — e põe as vinte e sete lado a lado, do tamanho da folha dele.
  Uma foto, uma rodada, e dá para comparar com o papel.

      node bancada-navegador/a-ficha-inteira.mjs
-->
<meta charset="utf-8">
<title>Ficha de bocas — Diabrete</title>
<style>
  body { margin: 0; background: #14100e; color: #f6efe0;
         font: 13px/1.3 system-ui, sans-serif; padding: 18px; }
  h2 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
       color: #c9a86a; margin: 22px 0 10px; }
  .grade { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; text-align: center; }
  canvas { background: #f7f3ea; border-radius: 6px; display: block; }
  figcaption { margin-top: 4px; font-size: 11px; opacity: .8; }
</style>
<div id="folha"></div>
<script type="module">
  import { BOCAS, CICLO_FALA, CICLO_SUTIL, CICLO_DEBOCHE, CICLO_RISADA } from '/src/f3Boca.ts';
  import { desenharBoca } from '/src/f3BocaTextura.ts';

  const folha = document.getElementById('folha');
  const jaVisto = new Set();

  function quadro(nome, rotulo) {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas');
    cv.width = 192; cv.height = 128;
    cv.style.width = '192px'; cv.style.height = '128px';
    desenharBoca(cv.getContext('2d'), BOCAS[nome]);
    const cap = document.createElement('figcaption');
    cap.textContent = rotulo ?? nome;
    fig.append(cv, cap);
    return fig;
  }

  function secao(titulo, nomes, rotulos) {
    const h = document.createElement('h2'); h.textContent = titulo;
    const g = document.createElement('div'); g.className = 'grade';
    nomes.forEach((n, i) => { g.append(quadro(n, rotulos?.[i])); jaVisto.add(n); });
    folha.append(h, g);
  }

  secao('Ciclo de fala — 12 quadros (folha 2)', CICLO_FALA,
    CICLO_FALA.map((n, i) => `F${i + 1} · ${n}`));
  secao('Fala irônica sutil — 5', CICLO_SUTIL);
  secao('Fala sarcástica / deboche — 6', CICLO_DEBOCHE);
  secao('Risada maliciosa / provocação — 6', CICLO_RISADA);
  secao('O resto do vocabulário', Object.keys(BOCAS).filter((n) => !jaVisto.has(n)));

  document.title = 'pronto';
</script>
